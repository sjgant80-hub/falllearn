<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FallLearn — how to actually talk to AI</title>
<meta name="description" content="A short course that marks your writing instead of agreeing with it. Twelve exercises: eight on asking properly, four on reading the answer. Works offline, no account, no model needed.">
<style>
:root{
  --paper:#fbfaf7; --card:#fff; --sunk:#f2f1ec; --rule:#ddd9d0; --rule-soft:#ebe8e1;
  --ink:#1c1a17; --mid:#57534c; --faint:#8a857c;
  --mark:#1f6f4f; --mark-soft:#e2f2ea;
  --miss:#a8442f; --miss-soft:#fbe9e4;
  --note:#8a6a12; --note-soft:#f7eed6;
  --serif:ui-serif,Georgia,'Iowan Old Style','Palatino Linotype',serif;
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#14151a; --card:#1b1d23; --sunk:#101116; --rule:#333741; --rule-soft:#25282f;
  --ink:#e8e6e1; --mid:#a5a29b; --faint:#6f6c66;
  --mark:#5fce9c; --mark-soft:#12291f;
  --miss:#e08a72; --miss-soft:#2b1815;
  --note:#dcb45c; --note-soft:#2a2213;
}}
:root[data-theme="dark"]{
  --paper:#14151a; --card:#1b1d23; --sunk:#101116; --rule:#333741; --rule-soft:#25282f;
  --ink:#e8e6e1; --mid:#a5a29b; --faint:#6f6c66;
  --mark:#5fce9c; --mark-soft:#12291f;
  --miss:#e08a72; --miss-soft:#2b1815;
  --note:#dcb45c; --note-soft:#2a2213;
}
:root[data-theme="light"]{
  --paper:#fbfaf7; --card:#fff; --sunk:#f2f1ec; --rule:#ddd9d0; --rule-soft:#ebe8e1;
  --ink:#1c1a17; --mid:#57534c; --faint:#8a857c;
  --mark:#1f6f4f; --mark-soft:#e2f2ea;
  --miss:#a8442f; --miss-soft:#fbe9e4;
  --note:#8a6a12; --note-soft:#f7eed6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;
  line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--note);outline-offset:2px}

header{border-bottom:1px solid var(--rule);background:var(--card)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header .wrap{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-top:15px;padding-bottom:15px}
h1{font-family:var(--serif);font-size:23px;margin:0;font-weight:600;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--mid)}
header .sub{color:var(--faint);font-size:13.5px;flex:1 1 auto;min-width:180px}
.ghost{background:none;border:1px solid var(--rule);color:var(--mid);border-radius:4px;padding:4px 10px;
  font-size:12px;cursor:pointer;font-family:var(--mono)}
.ghost:hover{border-color:var(--note);color:var(--note)}

.opening{padding:26px 0 6px}
.opening p{font-family:var(--serif);font-size:19px;line-height:1.5;margin:0 0 14px;color:var(--ink)}
.opening p.small{font-family:var(--sans);font-size:15px;color:var(--mid)}

nav{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule-soft);
  padding:9px 0;margin-bottom:22px}
nav .wrap{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.step{flex:0 0 auto;width:27px;height:27px;border-radius:50%;border:1px solid var(--rule);background:var(--card);
  color:var(--faint);font-size:11.5px;font-family:var(--mono);cursor:pointer;display:grid;place-items:center;padding:0}
.step:hover{border-color:var(--note)}
.step.here{border-color:var(--ink);color:var(--ink);font-weight:700}
.step.done{background:var(--mark-soft);border-color:var(--mark);color:var(--mark)}
.step.read{border-style:dashed}

main{padding-bottom:60px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
h2{font-family:var(--serif);font-size:27px;margin:0 0 12px;font-weight:600;line-height:1.2;letter-spacing:-.015em;text-wrap:balance}
.teaches{font-size:16.5px;color:var(--mid);margin:0 0 20px;max-width:62ch}

.card{border:1px solid var(--rule);border-radius:6px;background:var(--card);margin-bottom:18px;overflow:hidden}
.card>.top{padding:9px 15px;border-bottom:1px solid var(--rule-soft);background:var(--sunk);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.card>.body{padding:15px}
.brief{font-size:15.5px;color:var(--ink)}

.weak{border-left:3px solid var(--miss);background:var(--miss-soft);border-radius:0 4px 4px 0;padding:11px 14px;margin-top:13px}
.weak .q{font-family:var(--mono);font-size:13.5px;color:var(--ink);margin-bottom:7px;overflow-wrap:anywhere}
.weak .n{font-size:14px;color:var(--mid)}

textarea{width:100%;min-height:130px;background:var(--sunk);border:1px solid var(--rule);border-radius:5px;
  padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.55;resize:vertical}
.row{display:flex;gap:9px;align-items:center;margin-top:11px;flex-wrap:wrap}
.go{background:var(--ink);color:var(--paper);border:none;border-radius:5px;padding:9px 18px;font-weight:600;
  cursor:pointer;font-size:14.5px}
.go:hover{opacity:.87}
.count{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto}

.verdict{margin-top:15px;border-radius:5px;padding:13px 15px;border:1px solid var(--rule)}
.verdict.pass{border-color:var(--mark);background:var(--mark-soft)}
.verdict.fail{border-color:var(--miss);background:var(--miss-soft)}
.verdict h3{margin:0 0 9px;font-size:15.5px;font-family:var(--sans);font-weight:650}
.verdict.pass h3{color:var(--mark)} .verdict.fail h3{color:var(--miss)}
.ticks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tick{font-family:var(--mono);font-size:11.5px;border-radius:99px;padding:3px 10px;border:1px solid var(--rule);color:var(--faint)}
.tick.in{border-color:var(--mark);color:var(--mark);background:var(--card)}
.tick.out{border-color:var(--miss);color:var(--miss);background:var(--card)}
.fixes{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.fixes li{font-size:14.5px;color:var(--mid);line-height:1.5;padding-left:15px;position:relative}
.fixes li::before{content:"+";position:absolute;left:0;color:var(--miss);font-family:var(--mono);font-weight:700}
.fixes b{color:var(--ink);font-weight:650}
.limit{margin-top:11px;padding-top:10px;border-top:1px dashed var(--rule);font-size:13.5px;color:var(--faint);font-style:italic}

.reply{font-family:var(--serif);font-size:16px;line-height:1.6;background:var(--sunk);border-radius:5px;
  padding:14px 16px;border:1px solid var(--rule-soft);white-space:pre-wrap}
.picks{display:grid;gap:9px;margin-top:14px}
.pick{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--rule);border-radius:5px;
  padding:11px 13px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.pick:hover{border-color:var(--note)}
.pick.chosen{border-color:var(--ink)}
.pick.right{border-color:var(--mark);background:var(--mark-soft)}
.pick.wrong{border-color:var(--miss);background:var(--miss-soft)}
.pick .box{width:15px;height:15px;border:1px solid var(--rule);border-radius:3px;flex:0 0 auto;margin-top:3px}
.pick.chosen .box,.pick.right .box{background:var(--ink);border-color:var(--ink)}
.pick.right .box{background:var(--mark);border-color:var(--mark)}
.pick .t{font-weight:600;font-size:14.5px}
.pick .d{font-size:13.5px;color:var(--mid);margin-top:2px}
.comeback{margin-top:14px;border-left:3px solid var(--note);background:var(--note-soft);padding:12px 14px;border-radius:0 4px 4px 0}
.comeback .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--note);margin-bottom:6px}
.comeback p{margin:0 0 7px;font-family:var(--mono);font-size:13.5px;color:var(--ink)}
.comeback p:last-child{margin-bottom:0}

.foot{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.foot button{background:none;border:1px solid var(--rule);border-radius:5px;padding:8px 15px;cursor:pointer;
  color:var(--mid);font-size:14px}
.foot button:hover{border-color:var(--ink);color:var(--ink)}
.foot button:disabled{opacity:.4;cursor:default}
.foot button.next{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.done{text-align:center;padding:30px 0}
.done h2{font-size:30px}
.done .big{font-family:var(--mono);font-size:44px;color:var(--mark);margin:14px 0;font-variant-numeric:tabular-nums}

footer{border-top:1px solid var(--rule);background:var(--card);padding:18px 0;font-size:13px;color:var(--faint)}
footer .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
footer a{color:var(--mid)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:600px){ h2{font-size:23px} .opening p{font-size:17px} }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>FallLearn <em>— how to actually talk to AI</em></h1>
    <span class="sub">Twelve exercises. It marks what you write.</span>
    <button class="ghost" type="button" id="theme">theme</button>
  </div>
</header>

<nav><div class="wrap" id="steps"></div></nav>

<main class="wrap" id="main"></main>

<footer>
  <div class="wrap">
    <span id="proof">marker: learn.mjs</span>
    <span>Works offline. No account, no model, nothing sent anywhere.</span>
    <a href="https://sjgant80-hub.github.io/didy-raid/">The Armoury</a>
    <a href="https://github.com/sjgant80-hub/falllearn">source</a>
  </div>
</footer>

<script type="module">
// ══════════════════════════════════════════════════════════════════════════════════════════════
// learn.mjs — the part of a learning tool that is allowed to tell you no.
//
// Almost every course about talking to AI is a list of tips. You read it, you nod, and nothing has
// changed, because nothing ever checked whether you could actually do it. A lesson that cannot fail
// you has not taught you anything; it has only agreed with you.
//
// So this file is a marker, and it is a deliberately narrow one. It reads what you actually wrote
// and reports which of the eight things a request can carry are present, which are missing, and —
// for every missing one — the specific sentence you could add. Then it does the other half, which
// is the half people are never taught: it reads the ANSWER and points at the tells that mean you
// are being agreed with rather than helped.
//
// ⚑ WHAT THIS CANNOT DO, SAID UP FRONT BECAUSE THAT IS THE WHOLE LESSON.
// It checks whether you SAID a thing, not whether what you said is any good. It can see that you
// named an audience; it cannot know whether that audience is the right one. Every verdict here is
// "you left this out" or "you put this in" — never "this is good". A marker that claimed to judge
// quality would be doing exactly what it is teaching you to catch.
//
// No model. No network. No clock, no randomness. It runs on your machine, offline, and gives the
// same verdict on the same text every time — so you can argue with it, which you cannot do with a
// score that changes when you ask twice.
// ══════════════════════════════════════════════════════════════════════════════════════════════

/** Never let a value refuse to become text. An object whose toString throws must not stop a lesson. */
const text = (v) => { try { return String(v ?? ''); } catch { return ''; } };
const low = (v) => text(v).toLowerCase();
const words = (v) => low(v).match(/[a-z0-9'’-]+/g) || [];

/** Does any of these phrases appear? Returns the one that did, so the marker can quote it back. */
const anyOf = (haystack, needles) => needles.find(n => haystack.includes(n)) || null;

// ── THE EIGHT THINGS A REQUEST CAN CARRY ──────────────────────────────────────────────────────
// Chosen because each one is visible in the text itself. A signal a marker cannot see is a signal
// it must not claim to grade.
const CARRIES = Object.freeze({
  who: 'who',
  job: 'job',
  ground: 'ground',
  shape: 'shape',
  example: 'example',
  limits: 'limits',
  openness: 'openness',
  detail: 'detail',
});

const MEANS = Object.freeze({
  who: 'who the answer is for',
  job: 'what you actually want done',
  ground: 'what it should work from',
  shape: 'what the finished thing looks like',
  example: 'a sample of what good looks like',
  limits: 'what to leave out or avoid',
  openness: 'permission to push back',
  detail: 'concrete detail',
});

// The sentence to add when it is missing. Written as something you could paste, because "add more
// context" is advice nobody has ever been able to act on.
const FIXES = Object.freeze({
  who: 'Say who reads it: "This is for someone who has never used the product before."',
  job: 'Start with a verb and one object: "Write…", "Compare…", "Find the three…". "Help me with X" is not a job.',
  ground: 'Point at what it should use: "Use only the notes below" — then paste them. Otherwise it works from nothing and fills the gap itself.',
  shape: 'Say what finished looks like: "Six bullets, under 15 words each" or "one email, no subject line".',
  example: 'Show one: "Something like: \'We\'ve moved your delivery to Tuesday — sorry for the mess.\'" One example moves the answer further than a paragraph of description.',
  limits: 'Say what you do not want: "No introduction, no summary at the end, do not use the word \'solution\'."',
  openness: 'Give it room to say no: "If anything here is unclear or you would be guessing, say so instead of filling it in."',
  detail: 'Put something real in: a name, a number, a date, the actual sentence you are stuck on. A request with nothing specific in it can only come back generic.',
});

// ── reading a request ─────────────────────────────────────────────────────────────────────────

const AUDIENCE = ['for a ', 'for an ', 'for my ', 'for our ', 'for people', 'for someone', 'for the ',
  'audience', 'reader', 'readers', 'my boss', 'my team', 'my customers', 'my students', 'my mum',
  'beginner', 'beginners', 'a child', 'non-technical', 'nontechnical', 'someone who'];
const GROUND = ['below', 'above', 'attached', 'the notes', 'these notes', 'this file', 'the file',
  'the data', 'this data', 'the transcript', 'the document', 'the text', 'based on', 'using only',
  'use only', 'from the', 'in the email', 'pasted', 'here is', 'here are'];
const SHAPE = ['bullet', 'bullets', 'table', 'email', 'paragraph', 'paragraphs', 'sentence',
  'sentences', 'list', 'headline', 'headlines', 'summary', 'one page', 'word', 'words',
  'no more than', 'at most', 'under ', 'exactly ', 'format', 'columns', 'steps'];
const EXAMPLE = ['for example', 'e.g.', 'eg.', 'such as', 'like this', 'here is one', "here's one",
  'an example', 'example:', 'something like', 'similar to', 'in the style of'];
const LIMITS = ["don't", 'do not', 'avoid', 'without', 'never ', 'no jargon', 'leave out',
  'skip the', 'not the', 'rather than', 'instead of', 'except'];
const OPENNESS = ['if you', 'not sure', 'unsure', 'unclear', 'ask me', 'tell me what', 'what else',
  'push back', 'disagree', 'flag ', 'say so', 'would be guessing', 'guessing', 'missing',
  'before you start', 'questions'];

// A verb in the first few words is what separates a request from a topic. "Marketing plan" is a
// subject; "Draft a marketing plan" is a job somebody can finish and hand back.
const VERBS = ['write', 'draft', 'rewrite', 'edit', 'summarise', 'summarize', 'compare', 'list',
  'find', 'explain', 'translate', 'plan', 'check', 'review', 'turn', 'make', 'build', 'fix',
  'shorten', 'expand', 'name', 'suggest', 'give', 'show', 'sort', 'group', 'rank', 'pick',
  'reply', 'respond', 'answer', 'describe', 'outline', 'critique', 'proofread', 'convert'];

/** Concrete detail: a name, a number, a date, a quoted phrase. Vagueness has none of these. */
function hasDetail(raw) {
  const s = text(raw);
  if (/\d/.test(s)) return 'a number';
  if (/["“][^"”]{4,}["”]/.test(s)) return 'a quoted phrase';
  // A capitalised word that is not merely the start of a sentence — a name, a place, a product.
  const proper = s.match(/(?:[a-z0-9,;:)]\s+)([A-Z][a-zA-Z]{2,})/);
  if (proper) return `a name (${proper[1]})`;
  return null;
}

/**
 * What does this request actually carry? Each answer is `{ found, evidence }` — evidence is the
 * bit of your own text that made the marker say yes, so you can see it was not guessing.
 */
function read(request) {
  const raw = text(request);
  const s = low(raw);
  const w = words(raw);
  // Politeness is not part of the request. "Please could you write…" still starts with "write".
  const POLITE = new Set(['please', 'can', 'could', 'would', 'you', 'i', 'need', 'want', 'to', 'me',
    'hi', 'hey', 'hello', 'ok', 'okay', 'so', 'now', 'just', 'quickly', 'kindly', 'lets', "let's", 'let', 'us']);
  const opener = w.find(x => !POLITE.has(x)) || '';

  const sig = (found, evidence) => ({ found: Boolean(found), evidence: found ? String(evidence) : null });
  const detail = hasDetail(raw);

  // ⚑ A JOB MEANS THE REQUEST *STARTS* WITH A VERB, not that a verb appears somewhere in it.
  // Half these words are nouns as well: "marketing plan", "shopping list", "the review" all contain
  // a verb and none of them is a job. Looking anywhere in the sentence marked a bare topic as a
  // proper request — which is precisely the mistake the lesson is trying to correct.
  const verb = VERBS.includes(opener) ? opener : null;

  return {
    words: w.length,
    carries: {
      who: sig(anyOf(s, AUDIENCE), anyOf(s, AUDIENCE)),
      job: sig(verb, verb ? `it starts with a verb ("${verb}")` : null),
      ground: sig(anyOf(s, GROUND), anyOf(s, GROUND)),
      shape: sig(anyOf(s, SHAPE), anyOf(s, SHAPE)),
      example: sig(anyOf(s, EXAMPLE), anyOf(s, EXAMPLE)),
      limits: sig(anyOf(s, LIMITS), anyOf(s, LIMITS)),
      openness: sig(anyOf(s, OPENNESS), anyOf(s, OPENNESS)),
      detail: sig(detail, detail),
    },
  };
}

// ── marking one exercise ──────────────────────────────────────────────────────────────────────

/** The floor. Below this a request cannot carry anything, whatever words happen to be in it. */
const TOO_SHORT = 6;

/**
 * Mark a request against ONE lesson. A lesson names the handful of things it is teaching, and the
 * marker grades those and nothing else — being told off for missing something the lesson never
 * mentioned is how people learn to ignore feedback.
 */
function mark(request, asked) {
  const want = (Array.isArray(asked) ? asked : [])
    .map(a => text(a)).filter(a => Object.hasOwn(CARRIES, a));
  const r = read(request);

  // ⚑ NOTHING PASSES ON AN EMPTY PAGE. A marker that awards a point for a blank box is the
  // cannot-fail badge this whole tool exists to argue against.
  if (r.words < TOO_SHORT) {
    return {
      words: r.words, asked: want, met: [], missing: want, score: 0, passed: false,
      notes: want.map(k => ({ carries: k, means: MEANS[k], fix: FIXES[k] })),
      verdict: r.words === 0
        ? 'Nothing written yet.'
        : `Only ${r.words} word${r.words === 1 ? '' : 's'}. A request this short cannot carry what the lesson is asking for — it is a topic, not a job.`,
    };
  }

  const met = want.filter(k => r.carries[k].found);
  const missing = want.filter(k => !r.carries[k].found);
  const score = want.length === 0 ? null : met.length / want.length;

  return {
    words: r.words,
    asked: want,
    met, missing,
    score,
    passed: want.length > 0 && missing.length === 0,
    evidence: met.map(k => ({ carries: k, saw: r.carries[k].evidence })),
    notes: missing.map(k => ({ carries: k, means: MEANS[k], fix: FIXES[k] })),
    verdict: want.length === 0 ? 'This exercise asks for nothing, so there is nothing to mark.'
      : missing.length === 0
        ? `All ${want.length} in. ${LIMIT}`
        : `${met.length} of ${want.length}. Missing: ${missing.map(k => MEANS[k]).join(', ')}.`,
  };
}

// Said on every pass, on purpose. The moment a marker starts saying "excellent" it has stopped
// being useful and started being pleasant, which is the exact failure it is teaching you to spot.
const LIMIT = 'That is everything this checker can see — it knows you said these things, not whether they were the right ones.';

// ── reading the ANSWER: the half nobody teaches ───────────────────────────────────────────────
//
// Getting a reply is not the end of the exchange, it is the middle. These are the marks a reply
// leaves when it is agreeing with you rather than helping you — all of them visible in the text,
// none of them requiring another model to spot.

const TELLS = Object.freeze([
  {
    id: 'flattery',
    name: 'It opened by praising you',
    why: 'An answer that starts by telling you what a good question it was is warming you up, and the warmth costs words that could have been the answer.',
    look: ['great question', 'excellent question', "that's a great", 'what a great', 'good question',
      'absolutely right', "you're absolutely", 'i apologize', 'i apologise', 'my apologies'],
  },
  {
    id: 'nodoubt',
    name: 'Not one word of doubt anywhere',
    why: 'A long answer about anything real has soft edges. One with none has either checked everything or is guessing smoothly, and from the outside those look identical. Ask it which parts it is least sure of.',
    hedges: ['might', 'may ', 'could', 'roughly', 'about ', 'approximately', 'i think', 'unclear',
      'not sure', 'uncertain', 'depends', 'assuming', 'if ', 'unless', 'likely', 'probably',
      'appears', 'seems', 'typically', 'usually', 'generally'],
    minWords: 90,
  },
  {
    id: 'precision',
    name: 'Precise numbers from nowhere',
    why: 'Exact figures with no source are the easiest thing in the world to produce and the hardest to notice. "73% of teams" reads as research and can be invented whole. Ask where the number came from.',
    look: [/\b\d{1,3}(\.\d+)?\s?%/, /\b(19|20)\d{2}\b/, /\bstudies show\b/i, /\bresearch shows\b/i,
      /\bexperts (say|agree)\b/i, /\baccording to (a |an )?(study|survey|report)\b/i],
    sources: ['source', 'sources', 'link', 'https://', 'citation', 'reference', 'i cannot verify',
      'i have not checked', 'from memory', 'you should check'],
  },
  {
    id: 'padding',
    name: 'Warm-up before the answer',
    why: 'Openers like "in today\'s fast-paced world" are what a model writes while it works out what to say. Anything you could delete without losing meaning was not an answer.',
    look: ["in today's", 'in the world of', 'fast-paced', "it's important to note", 'it is important to note',
      "it's worth noting", 'delve', 'navigate the', 'landscape of', 'in conclusion', 'furthermore',
      'moreover', 'that being said', 'at the end of the day', 'unlock', 'harness the power',
      'ever-evolving', 'in summary'],
  },
  {
    id: 'echo',
    name: 'It repeated your question back',
    why: 'Restating what you just asked fills the top of the reply with words you already had. It is not comprehension, it is throat-clearing.',
  },
]);

const wordSet = (v) => new Set(words(v));

/**
 * Read a reply and name the tells. Each returns the evidence that fired it, because "this looks
 * like AI slop" is not something a person can learn from — "it praised you in the first line, here
 * is the line" is.
 */
function tells(reply, request) {
  const raw = text(reply);
  const s = low(raw);
  const w = words(raw);
  const out = [];
  const hit = (t, evidence) => out.push({ id: t.id, name: t.name, why: t.why, evidence: text(evidence) });

  for (const t of TELLS) {
    if (t.id === 'flattery' || t.id === 'padding') {
      const found = anyOf(s, t.look);
      if (found) hit(t, `it says "${found}"`);
    }
    if (t.id === 'nodoubt') {
      // Only meaningful on an answer long enough to have needed a soft edge somewhere.
      if (w.length >= t.minWords && !t.hedges.some(h => s.includes(h))) {
        hit(t, `${w.length} words and not one of "might", "roughly", "depends", "I'm not sure"`);
      }
    }
    if (t.id === 'precision') {
      const found = t.look.find(rx => rx.test(raw));
      const cited = t.sources.some(src => s.includes(src));
      if (found && !cited) hit(t, `a figure or claim like "${(raw.match(found) || [''])[0]}" with nothing said about where it came from`);
    }
    if (t.id === 'echo') {
      const q = wordSet(request);
      if (q.size >= 4 && w.length >= 12) {
        const opening = new Set(w.slice(0, Math.min(25, w.length)));
        let shared = 0;
        for (const x of opening) if (q.has(x)) shared += 1;
        if (shared / opening.size >= 0.5) hit(t, `${Math.round((shared / opening.size) * 100)}% of the opening is words from your own question`);
      }
    }
  }
  return out;
}

/**
 * What to do about it. A tell nobody can act on is trivia, so every reading ends with the sentence
 * you can send back — the follow-up IS the skill this whole thing is teaching.
 */
const COMEBACK = Object.freeze({
  flattery: 'Answer the question first. Skip the opening line.',
  nodoubt: 'Which parts of that are you least sure about, and what would you need to check them?',
  precision: 'Where does each of those numbers come from? Mark any you cannot source.',
  padding: 'Cut everything that is not the answer. Give it to me again, half the length.',
  echo: 'Do not restate my question. Start at the first new thing you have to say.',
});

/** The whole loop in one call: what you sent, what came back, what to send next. */
function exchange(request, reply, asked) {
  const marked = mark(request, asked);
  const found = tells(reply, request);
  return {
    sent: marked,
    back: found,
    // Ordered as the tells are declared, so two people looking at the same exchange are handed the
    // same next move rather than whichever one their tool happened to list first.
    next: found.map(t => ({ id: t.id, ask: COMEBACK[t.id] })),
    clean: text(reply).trim().length > 0 && found.length === 0,
  };
}


// lessons.mjs — the course.
//
// Two kinds of exercise, because talking to an AI is two skills and courses only ever teach one.
//
//   WRITE  you write a real request and the marker says which of the things it asks for are in it.
//   SPOT   you are shown a real answer and have to find what is wrong with it before it is told you.
//
// The order is not decorative. Each lesson adds one thing and keeps everything before it, so by the
// end you are writing the whole request without being reminded — which is the only test of whether
// you learned it rather than followed it.

const WRITE = 'write';
const SPOT = 'spot';

const LESSONS = Object.freeze([
  {
    id: 'job', kind: WRITE, title: 'Ask for a thing, not a topic',
    teaches: 'Most requests that come back useless were never requests. "Marketing plan" is a subject; nobody can finish a subject and hand it to you. Start with a verb.',
    brief: 'You need a short note telling your customers that Saturday deliveries are stopping. Ask for it.',
    asked: ['job', 'detail'],
    weak: 'saturday deliveries',
    weakWhy: 'Two words and no verb. This is a topic, so what comes back is whatever the model guesses you meant — usually an essay about logistics.',
  },
  {
    id: 'who', kind: WRITE, title: 'Say who is going to read it',
    teaches: 'The same facts written for your boss and for a stranger are two different pieces of writing. If you do not say, you get the average of everybody, which suits nobody.',
    brief: 'Same note about Saturday deliveries — but now say who reads it.',
    asked: ['job', 'who', 'detail'],
    weak: 'Write a note about Saturday deliveries ending on 4 March.',
    weakWhy: 'A real job with a real date, and still no idea who is reading. It will land somewhere between a press release and a text to a friend.',
  },
  {
    id: 'ground', kind: WRITE, title: 'Give it something to work from',
    teaches: 'Asked about something it cannot see, a model does not stop — it fills the gap with what usually goes there. That is where invented details come from. Point it at your notes and the gap closes.',
    brief: 'You have the delivery dates and the reason in a note. Ask for the customer message, and tell it to use only that.',
    asked: ['job', 'who', 'ground'],
    weak: 'Write a note for customers about why Saturday deliveries are ending.',
    weakWhy: 'It has no idea why they are ending, so it will invent a plausible reason — and a plausible reason is the hardest kind of wrong to notice.',
  },
  {
    id: 'shape', kind: WRITE, title: 'Say what finished looks like',
    teaches: 'A request with no shape comes back as five paragraphs, because five paragraphs is the safe answer to everything. Say the format and the length and you stop editing it down.',
    brief: 'Ask again, and this time say exactly what you want handed back.',
    asked: ['job', 'who', 'shape'],
    weak: 'Write a customer note about Saturday deliveries for people who order weekly.',
    weakWhy: 'Good so far — but nothing says whether you want a text message or a page. You will get the page.',
  },
  {
    id: 'example', kind: WRITE, title: 'Show one example',
    teaches: 'One example moves an answer further than a paragraph describing what you want. Tone is almost impossible to describe and trivial to demonstrate.',
    brief: 'Ask for the note again, and show one line in the voice you actually want.',
    asked: ['job', 'shape', 'example'],
    weak: 'Write it in a friendly but professional tone, warm but not too casual.',
    weakWhy: 'Every one of those words means something different to everybody. One real sentence would have settled it.',
  },
  {
    id: 'limits', kind: WRITE, title: 'Say what you do not want',
    teaches: 'You know what you are sick of seeing. Say it. Ruling things out is faster than describing what should be there instead, and it is the fastest way to kill the house style you did not ask for.',
    brief: 'Ask for the note, and rule out the openers and closers you never want to see.',
    asked: ['job', 'shape', 'limits'],
    weak: 'Write the note and make it good and natural and not too corporate.',
    weakWhy: '"Not too corporate" is a feeling. "No opening line, no sign-off, never the word \'valued\'" is a rule it can follow.',
  },
  {
    id: 'openness', kind: WRITE, title: 'Give it room to say no',
    teaches: 'A model asked a question it cannot answer will answer anyway — that is the single most expensive habit it has. One sentence giving it permission to stop turns a confident invention into a question you can actually answer.',
    brief: 'Ask for the note, and add the line that lets it come back to you instead of guessing.',
    asked: ['job', 'who', 'openness'],
    weak: 'Write the customer note using the details below. Get it right.',
    weakWhy: '"Get it right" is not permission to admit a gap. It is pressure to sound right, which is a different thing and easier to fake.',
  },
  {
    id: 'whole', kind: WRITE, title: 'All of it, without being reminded',
    teaches: 'This is the test. Nothing new is introduced — you write one request carrying everything, in your own words, with nobody prompting you for the parts.',
    brief: 'Write the full request for the Saturday delivery note, as if for real.',
    asked: Object.keys(CARRIES),
    weak: 'Write a really good customer email about the delivery change, thanks.',
    weakWhy: '"Really good" is the whole request doing no work at all. Everything that would have made it good was left for the model to guess.',
  },

  // ── the half nobody teaches ──────────────────────────────────────────────────────────────────
  {
    id: 'flattery', kind: SPOT, title: 'When it opens by praising you',
    teaches: 'An answer that begins by telling you what a good question that was is warming you up. The warmth costs words that could have been the answer, and it is the cheapest signal that you are being agreed with.',
    reply: `Great question! Pricing is such an important topic. Here's my thinking on whether you should raise your prices: it really depends on your market position and your customers' willingness to pay.`,
    find: ['flattery'],
  },
  {
    id: 'padding', kind: SPOT, title: 'The warm-up before the answer',
    teaches: 'Openers like "in today\'s fast-paced world" are what gets written while the answer is being worked out. Anything you could delete without losing meaning was not an answer.',
    reply: `In today's fast-paced world, it's important to note that customer communication is key. Furthermore, as we navigate the ever-evolving landscape of delivery logistics, businesses must unlock new ways of keeping customers informed.`,
    find: ['padding'],
  },
  {
    id: 'precision', kind: SPOT, title: 'Numbers out of nowhere',
    teaches: 'An exact figure with no source is the easiest thing to produce and the hardest to catch. It reads as research. Ask where each number came from and watch which ones survive.',
    reply: `Studies show that 73% of customers prefer email notifications, and research shows a 2.4x increase in retention when businesses give at least 14 days notice. Experts agree this is the single biggest factor.`,
    find: ['precision'],
  },
  {
    id: 'nodoubt', kind: SPOT, title: 'Not one soft edge anywhere',
    teaches: 'A long answer about anything real has parts it is less sure of. One with none has either checked everything or is guessing smoothly, and from where you are sitting those look the same. Ask which parts are weakest.',
    reply: `You should stop Saturday deliveries at the end of the month. Customers will understand and retention will not be affected. Send one email two weeks before and follow up on the day. Your competitors have all made this change and none of them lost business. The operational saving will cover the cost of the transition within one quarter, and your drivers will welcome the change. Schedule the announcement for a Tuesday morning, which is when open rates are strongest, and keep the message to three short paragraphs so that it reads on a phone without scrolling.`,
    find: ['nodoubt'],
  },
  {
    id: 'stack', kind: SPOT, title: 'All of it at once',
    teaches: 'Real answers rarely fail in only one way. This is what a genuinely bad reply looks like — find everything wrong with it, then send the follow-up.',
    reply: `Great question! In today's fast-paced world, customer communication is absolutely critical. Studies show that 89% of customers expect at least 30 days notice of any service change. You should announce the change immediately, send a follow-up email, and offer a discount. This will maintain satisfaction and protect your revenue. It's important to note that businesses who handle this well see a 3.2x improvement in loyalty.`,
    find: ['flattery', 'padding', 'precision'],
  },
]);

/** The lesson before this one is finished — used to walk the course in order. */
const byId = (id) => LESSONS.find(l => l.id === id) || null;
const indexOf = (id) => LESSONS.findIndex(l => l.id === id);


// ══════════════════════════════════════════════════════════════════════════════════════════════
// The page. It only DRAWS what the marker above decided — every verdict on this screen comes from
// the same code that gets marked itself, so what a learner is told is what was checked.
// ══════════════════════════════════════════════════════════════════════════════════════════════
const $ = (s) => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };

const SAVE = 'falllearn.progress.v2';
const load = () => { try { const p = JSON.parse(localStorage.getItem(SAVE) || '{}');
  return { at: Number.isInteger(p.at) ? p.at : 0, done: Array.isArray(p.done) ? p.done.filter(x => typeof x === 'string') : [],
           drafts: (p.drafts && typeof p.drafts === 'object') ? p.drafts : {} }; }
  catch { return { at: 0, done: [], drafts: {} }; } };
const save = () => { try { localStorage.setItem(SAVE, JSON.stringify(me)); } catch { /* private mode: carry on, just do not remember */ } };
let me = load();
let picked = new Set();
let checked = false;

function steps() {
  const bar = $('#steps'); bar.replaceChildren();
  LESSONS.forEach((l, i) => {
    const b = el('button', 'step' + (i === me.at ? ' here' : '') + (me.done.includes(l.id) ? ' done' : '') + (l.kind === SPOT ? ' read' : ''), String(i + 1));
    b.type = 'button';
    b.title = l.title;
    b.addEventListener('click', () => { me.at = i; save(); draw(); });
    bar.append(b);
  });
}

// ── a writing exercise ────────────────────────────────────────────────────────────────────────
function drawWrite(l, main) {
  const brief = el('div', 'card');
  brief.append(el('div', 'top', 'the job'));
  const bb = el('div', 'body');
  bb.append(el('div', 'brief', l.brief));
  const weak = el('div', 'weak');
  weak.append(el('div', 'q', l.weak));
  weak.append(el('div', 'n', l.weakWhy));
  bb.append(weak);
  brief.append(bb); main.append(brief);

  const box = el('div', 'card');
  box.append(el('div', 'top', 'your turn'));
  const body = el('div', 'body');
  const ta = el('textarea');
  ta.id = 'answer';
  ta.placeholder = 'Write the request you would actually send…';
  ta.value = me.drafts[l.id] || '';
  ta.setAttribute('aria-label', 'Write your request');
  body.append(ta);
  const row = el('div', 'row');
  const go = el('button', 'go', 'Mark it'); go.type = 'button';
  const count = el('span', 'count');
  const tally = () => { count.textContent = `${(ta.value.trim().match(/\S+/g) || []).length} words`; };
  tally();
  ta.addEventListener('input', () => { tally(); me.drafts[l.id] = ta.value; save(); });
  row.append(go, count);
  body.append(row);
  const out = el('div'); out.id = 'out';
  body.append(out);
  box.append(body); main.append(box);

  go.addEventListener('click', () => {
    const m = mark(ta.value, l.asked);
    out.replaceChildren(drawMark(m));
    if (m.passed && !me.done.includes(l.id)) me.done.push(l.id);
    save(); steps();
    out.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
}

function drawMark(m) {
  const v = el('div', 'verdict ' + (m.passed ? 'pass' : 'fail'));
  v.append(el('h3', null, m.passed ? 'Everything this exercise asked for is in there.' : m.verdict));
  const ticks = el('div', 'ticks');
  for (const k of m.asked) {
    ticks.append(el('span', 'tick ' + (m.met.includes(k) ? 'in' : 'out'), (m.met.includes(k) ? '✓ ' : '✗ ') + MEANS[k]));
  }
  v.append(ticks);
  if (m.notes.length) {
    const ul = el('ul', 'fixes');
    for (const n of m.notes) {
      const li = el('li');
      li.append(el('b', null, n.means + ' — '));
      li.append(document.createTextNode(n.fix));
      ul.append(li);
    }
    v.append(ul);
  }
  v.append(el('div', 'limit', LIMIT));
  return v;
}

// ── a reading exercise ────────────────────────────────────────────────────────────────────────
function drawSpot(l, main) {
  picked = new Set(); checked = false;

  const card = el('div', 'card');
  card.append(el('div', 'top', 'the answer that came back'));
  const body = el('div', 'body');
  body.append(el('div', 'reply', l.reply));
  card.append(body); main.append(card);

  const q = el('div', 'card');
  q.append(el('div', 'top', "what's wrong with it? pick every one that applies"));
  const qb = el('div', 'body');
  const picks = el('div', 'picks');
  const buttons = new Map();
  for (const t of TELLS) {
    const b = el('button', 'pick'); b.type = 'button';
    b.append(el('span', 'box'));
    const txt = el('span');
    txt.append(el('span', 't', t.name));
    txt.append(el('span', 'd', t.why));
    b.append(txt);
    b.addEventListener('click', () => {
      if (checked) return;
      if (picked.has(t.id)) { picked.delete(t.id); b.classList.remove('chosen'); }
      else { picked.add(t.id); b.classList.add('chosen'); }
    });
    buttons.set(t.id, b);
    picks.append(b);
  }
  qb.append(picks);
  const row = el('div', 'row');
  const go = el('button', 'go', 'Check'); go.type = 'button';
  row.append(go);
  qb.append(row);
  const out = el('div'); out.id = 'out';
  qb.append(out);
  q.append(qb); main.append(q);

  go.addEventListener('click', () => {
    if (checked) return;
    checked = true;
    // The truth comes from reading the reply, not from an answer key typed next to it — so the
    // lesson cannot drift away from what the reader actually finds.
    const real = new Set(tells(l.reply, l.brief || '').map(t => t.id));
    for (const [id, b] of buttons) {
      b.classList.remove('chosen');
      if (real.has(id)) b.classList.add('right');
      else if (picked.has(id)) b.classList.add('wrong');
    }
    const missed = [...real].filter(id => !picked.has(id));
    const wrong = [...picked].filter(id => !real.has(id));
    const v = el('div', 'verdict ' + (missed.length === 0 && wrong.length === 0 ? 'pass' : 'fail'));
    v.append(el('h3', null,
      missed.length === 0 && wrong.length === 0 ? `All ${real.size} found, nothing invented.`
        : missed.length && wrong.length ? `Missed ${missed.length}, and called out ${wrong.length} that is not there.`
        : missed.length ? `Missed ${missed.length} of ${real.size}.`
        : `${wrong.length} of those is not actually in this answer — reading a fault in is its own mistake.`));
    const cb = el('div', 'comeback');
    cb.append(el('div', 'l', 'send this back'));
    for (const id of real) cb.append(el('p', null, COMEBACK[id]));
    v.append(cb);
    out.replaceChildren(v);
    if (missed.length === 0 && wrong.length === 0 && !me.done.includes(l.id)) me.done.push(l.id);
    save(); steps();
    out.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
}

// ── the whole page ────────────────────────────────────────────────────────────────────────────
function draw() {
  const main = $('#main'); main.replaceChildren();
  steps();

  if (me.at >= LESSONS.length) return drawEnd(main);
  const l = LESSONS[me.at];

  if (me.at === 0) {
    const open = el('div', 'opening');
    const p1 = el('p');
    p1.textContent = 'Most advice about talking to AI is a list of tips. You read it, you nod, and nothing changes — because nothing ever checked whether you could do it.';
    const p2 = el('p', 'small');
    p2.textContent = 'This marks what you write. It can tell you no, and it will say exactly what is missing and the sentence to add. It runs on your machine; nothing you type here goes anywhere.';
    open.append(p1, p2); main.append(open);
  }

  main.append(el('div', 'kicker', `${l.kind === SPOT ? 'reading the answer' : 'asking properly'} · ${me.at + 1} of ${LESSONS.length}`));
  main.append(el('h2', null, l.title));
  main.append(el('p', 'teaches', l.teaches));

  if (l.kind === SPOT) drawSpot(l, main); else drawWrite(l, main);

  const foot = el('div', 'foot');
  const back = el('button', null, '← back'); back.type = 'button'; back.disabled = me.at === 0;
  back.addEventListener('click', () => { me.at -= 1; save(); draw(); window.scrollTo(0, 0); });
  const fwd = el('button', 'next', me.at === LESSONS.length - 1 ? 'finish →' : 'next →'); fwd.type = 'button';
  fwd.addEventListener('click', () => { me.at += 1; save(); draw(); window.scrollTo(0, 0); });
  foot.append(back, fwd);
  main.append(foot);
}

function drawEnd(main) {
  const d = el('div', 'done');
  d.append(el('h2', null, 'That is the whole course.'));
  d.append(el('div', 'big', `${me.done.length} / ${LESSONS.length}`));
  const p = el('p', 'teaches');
  p.style.margin = '0 auto 18px';
  p.textContent = me.done.length === LESSONS.length
    ? 'Every exercise passed on its own terms. The habit worth keeping is the last one: when an answer comes back smooth and certain, ask it which part it is least sure about.'
    : `${LESSONS.length - me.done.length} still open. Nothing is stopping you moving on — but the ones you passed are the ones you can actually do.`;
  d.append(p);
  const again = el('button', 'go', 'start again'); again.type = 'button';
  again.addEventListener('click', () => { me = { at: 0, done: [], drafts: {} }; save(); draw(); window.scrollTo(0, 0); });
  d.append(again);
  main.append(d);
}

$('#theme').addEventListener('click', () => {
  const set = document.documentElement.getAttribute('data-theme');
  const dark = set ? set === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
});

$('#proof').textContent = `marker: learn.mjs · ${LESSONS.length} exercises · ${TELLS.length} tells`;
draw();
</script>
</body>
